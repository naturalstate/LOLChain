<svg width="1060" height="360" viewBox="0 0 1060 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5162"/>
    </marker>
  </defs>

  <rect width="1060" height="360" rx="16" fill="#0a0e14"/>
  <rect x="1" y="1" width="1058" height="358" rx="15" fill="none" stroke="#1d2430" stroke-width="1.5"/>
  <text x="36" y="40" font-size="19" font-weight="700" fill="#e4e8f0">Three ways to query the graph</text>

  <!-- ============ CARD 1: I HAVE X ============ -->
  <rect x="36" y="64" width="308" height="268" rx="12" fill="#0f141c" stroke="#2a3342" stroke-width="1.2"/>
  <text x="60" y="100" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#e5484d">I HAVE X</text>
  <text x="60" y="122" font-size="12.5" fill="#8a93a6">Forward reach — what a foothold unlocks.</text>
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11.5">
    <!-- arrows -->
    <line x1="146" y1="233" x2="232" y2="186" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="146" y1="233" x2="232" y2="233" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="146" y1="233" x2="232" y2="280" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <!-- start -->
    <rect x="60" y="218" width="84" height="30" rx="8" fill="#141b26" stroke="#e4e8f0" stroke-width="1.5"/>
    <circle cx="78" cy="233" r="4.5" fill="#4ea1d3"/><text x="90" y="237" fill="#e4e8f0" font-weight="600">SSRF</text>
    <!-- targets -->
    <rect x="234" y="172" width="86" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="250" cy="186" r="4.5" fill="#d9a441"/><text x="262" y="190" fill="#c7cdda">IMDS</text>
    <rect x="234" y="219" width="86" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="250" cy="233" r="4.5" fill="#8a93a6"/><text x="262" y="237" fill="#c7cdda">ProxyL.</text>
    <rect x="234" y="266" width="86" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="250" cy="280" r="4.5" fill="#56b877"/><text x="262" y="284" fill="#c7cdda">Pod RCE</text>
  </g>
  <text x="60" y="316" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11" fill="#56b877">→ 11 vulns · 6 goals reachable</text>

  <!-- ============ CARD 2: X -> GOAL Z ============ -->
  <rect x="376" y="64" width="308" height="268" rx="12" fill="#0f141c" stroke="#2a3342" stroke-width="1.2"/>
  <text x="400" y="100" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#e5484d">X &#8594; GOAL Z</text>
  <text x="400" y="122" font-size="12.5" fill="#8a93a6">Ranked paths to a chosen goal.</text>
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11.5">
    <line x1="530" y1="166" x2="530" y2="196" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="530" y1="228" x2="530" y2="258" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <!-- X -->
    <rect x="490" y="150" width="80" height="30" rx="8" fill="#141b26" stroke="#e4e8f0" stroke-width="1.5"/>
    <circle cx="507" cy="165" r="4.5" fill="#4ea1d3"/><text x="519" y="169" fill="#e4e8f0" font-weight="600">SSRF</text>
    <text x="582" y="188" font-size="10" fill="#4ea1d3">ssrf</text>
    <!-- mid -->
    <rect x="490" y="198" width="80" height="30" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="507" cy="213" r="4.5" fill="#d9a441"/><text x="519" y="217" fill="#c7cdda">IMDS</text>
    <text x="582" y="236" font-size="10" fill="#4ea1d3">cloud creds</text>
    <!-- goal -->
    <rect x="474" y="260" width="112" height="32" rx="8" fill="#241015" stroke="#e5484d" stroke-width="1.4"/>
    <text x="488" y="280" fill="#e5484d">&#9873;</text><text x="504" y="280" fill="#ef8a8e" font-weight="700">cloud acct</text>
  </g>
  <text x="400" y="316" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11" fill="#8a93a6">documented paths first</text>

  <!-- ============ CARD 3: I WANT Z ============ -->
  <rect x="716" y="64" width="308" height="268" rx="12" fill="#0f141c" stroke="#2a3342" stroke-width="1.2"/>
  <text x="740" y="100" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#e5484d">I WANT Z</text>
  <text x="740" y="122" font-size="12.5" fill="#8a93a6">Backward — what gives it, and the prereqs.</text>
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11.5">
    <line x1="846" y1="186" x2="892" y2="227" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="846" y1="233" x2="892" y2="233" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="846" y1="280" x2="892" y2="239" stroke="#4a5162" stroke-width="1.5" marker-end="url(#a)"/>
    <!-- entries -->
    <rect x="740" y="172" width="104" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="756" cy="186" r="4.5" fill="#4ea1d3"/><text x="768" y="190" fill="#c7cdda">Cmd Inj</text>
    <rect x="740" y="219" width="104" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="756" cy="233" r="4.5" fill="#4ea1d3"/><text x="768" y="237" fill="#c7cdda">LFI &#8594; RCE</text>
    <rect x="740" y="266" width="104" height="28" rx="8" fill="#141b26" stroke="#2a3342" stroke-width="1.1"/>
    <circle cx="756" cy="280" r="4.5" fill="#4ea1d3"/><text x="768" y="284" fill="#c7cdda">Webshell</text>
    <!-- goal -->
    <rect x="894" y="217" width="104" height="32" rx="8" fill="#241015" stroke="#e5484d" stroke-width="1.4"/>
    <text x="908" y="237" fill="#e5484d">&#9873;</text><text x="924" y="237" fill="#ef8a8e" font-weight="700">RCE</text>
  </g>
  <text x="740" y="316" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="11" fill="#8a93a6">entry points + each step's needs</text>
</svg>
