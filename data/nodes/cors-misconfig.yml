id: cors-misconfig
name: CORS Misconfiguration
slug: cors-misconfig
tier: advanced
category: web
aliases: [cors]
summary: >
  The server reflects an arbitrary Origin with Access-Control-Allow-Credentials:
  true, letting an attacker page read authenticated responses — including tokens
  and personal data — from the victim's session.
requires:
  - reflected-origin
provides:
  - read-session-token
  - info-disclosure
achieves:
  - account-takeover
detection: >
  Access-Control-Allow-Origin reflecting request Origin with credentials true;
  null origin allowed; cross-origin reads of sensitive endpoints.
remediation: >
  Strict origin allowlist, never reflect Origin, avoid credentials on CORS unless
  required, separate sensitive APIs from CORS-enabled ones.
mitre: [T1190]
references:
  - title: PortSwigger - CORS
    url: https://portswigger.net/web-security/cors
chains:
  - to: session-hijack
    via: [read-session-token]
    outcome: Read the victim's token/session data cross-origin to hijack the account.
    tier: advanced
    difficulty: medium
    documented: false
