id: ad-domain-takeover
name: Active Directory Domain Takeover
slug: ad-domain-takeover
tier: expert
category: active-directory
aliases: [domain-admin, ad-takeover, da]
summary: >
  The final consolidation step: with DCSync (or equivalent Tier-0 control) in hand,
  replicate every credential including krbtgt, forge golden tickets, and seize full,
  persistent control of the domain. Reached by chaining the discrete AD techniques
  (roasting, delegation, ACL/object-control abuse) up to domain-head rights.
requires:
  - dcsync-rights
provides:
  - lateral-movement
achieves:
  - domain-admin
detection: >
  Kerberoast/AS-REP requests, DCSync replication from non-DCs, abnormal ACL changes,
  golden/silver-ticket indicators, new privileged group members.
remediation: >
  Tiered admin model, strong service-account passwords/gMSA, least-privilege ACLs,
  monitor replication and privileged-group changes, LAPS.
mitre: [T1003.006, T1558, T1484]
references:
  - title: Microsoft - Securing privileged access
    url: https://learn.microsoft.com/en-us/security/privileged-access-workstations/overview
chains:
  - to: ransomware-deployment
    via: [lateral-movement]
    outcome: >
      Use domain-wide control to push ransomware to every host (GPO/PsExec) and
      exfiltrate before encrypting — the standard human-operated ransomware endgame.
    tier: expert
    difficulty: medium
    documented: true
    references:
      - https://www.cisa.gov/stopransomware/ransomware-guide
