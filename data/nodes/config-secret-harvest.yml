id: config-secret-harvest
name: Config / Env Credential Harvest
slug: config-secret-harvest
tier: advanced
category: cloud
domains: [cloud, host, web]
aliases: [post-ex-cred-harvest, config-secrets, env-cred-theft]
summary: >
  A common post-exploitation hop: once you have code execution on a host, read cloud
  and storage credentials out of config files, environment variables and metadata —
  turning an app-tier RCE into cloud-account access. (MOVEit 2023: the LEMURLOOT
  webshell pulled Azure Blob storage keys from MOVEit's configuration.)
requires:
  - os-command-exec
provides:
  - cloud-credentials
achieves:
  - cloud-account-compromise
detection: >
  Reads of app config / .env / cloud SDK credential files shortly after a web process
  gains shell; cloud API calls originating from app servers that don't normally make
  them; new access-key usage right after an RCE alert.
remediation: >
  Keep secrets out of files/env — use a secrets manager with short-lived tokens;
  least-privilege the credentials that must exist; egress-filter app tiers; alert on
  credential use from the app host.
mitre: [T1552.001, T1552.005]
references:
  - title: "CISA AA23-158A — MOVEit (#StopRansomware: Cl0p)"
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-158a
  - title: "Mandiant — MOVEit zero-day data theft"
    url: https://cloud.google.com/blog/topics/threat-intelligence/zero-day-moveit-data-theft
chains:
  - to: cloud-data-access
    via: [cloud-credentials]
    outcome: Use harvested storage keys to read the cloud data stores directly.
    tier: advanced
    difficulty: medium
    documented: true
    references:
      - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-158a
  - to: cloud-iam-privesc
    via: [cloud-credentials]
    outcome: Pivot harvested credentials into IAM enumeration and role escalation.
    tier: advanced
    difficulty: medium
    documented: false
