id: credential-dumping
name: Credential Dumping
slug: credential-dumping
tier: advanced
category: network
domains: [host, active-directory, network]
aliases: [lsass-dump, mimikatz, os-credential-dumping]
summary: >
  With code execution on a host, the attacker extracts credentials from memory and
  local stores (LSASS, SAM, cached tickets, DPAPI) — harvesting domain and service
  accounts to move laterally and escalate toward domain dominance.
requires:
  - priv-esc
provides:
  - domain-credentials
  - lateral-movement
achieves: []
detection: >
  LSASS process access/handles (Mimikatz, comsvcs minidump); SAM/SECURITY hive reads;
  suspicious use of reg save / procdump; credential use spreading across hosts.
remediation: >
  Credential Guard / LSASS protection; EDR on LSASS access; disable cached creds where
  possible; tiered admin and unique local admin passwords (LAPS); restrict lateral SMB/RDP.
mitre: [T1003, T1003.001]
references:
  - title: "MITRE ATT&CK — OS Credential Dumping (T1003)"
    url: https://attack.mitre.org/techniques/T1003/
  - title: "CISA — #StopRansomware Guide"
    url: https://www.cisa.gov/stopransomware/ransomware-guide
chains:
  - to: ad-domain-takeover
    via: [domain-credentials]
    outcome: Escalate harvested domain credentials through AD misconfigurations to Domain Admin.
    tier: expert
    difficulty: hard
    documented: false
  - to: ransomware-deployment
    via: [lateral-movement]
    outcome: Spread across hosts with the dumped credentials to stage mass encryption.
    tier: expert
    difficulty: medium
    documented: false
