id: cicd-secret-exfil
name: Pipeline Secret Exfiltration
slug: cicd-secret-exfil
tier: advanced
category: cicd
aliases: [secret-exfil, ci-secret-theft]
summary: >
  Secrets harvested from a build runner (cloud credentials, signing keys, registry
  tokens) unlock cloud accounts and write access to published artifacts.
requires:
  - ci-secrets
provides:
  - cloud-credentials
  - supply-chain-write
achieves: []
detection: >
  CI secrets used from outside the runner's IP ranges; registry/signing-key use
  from new locations; cloud API calls authenticated with pipeline identities off-net.
remediation: >
  Short-lived OIDC-federated credentials over static secrets, scope tokens to the
  job, egress controls on runners, secret-scanning and rotation.
mitre: [T1552, T1195.002]
references:
  - title: GitHub - Security hardening for Actions
    url: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
  - title: "Codecov Bash Uploader compromise — post-mortem (2021)"
    url: https://about.codecov.io/apr-2021-post-mortem/
chains:
  - to: supply-chain-backdoor
    via: [supply-chain-write]
    outcome: Use stolen signing/registry keys to publish a backdoored artifact.
    tier: expert
    difficulty: hard
    documented: true
    references:
      - https://slsa.dev/
