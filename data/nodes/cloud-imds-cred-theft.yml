id: cloud-imds-cred-theft
name: Cloud IMDS Credential Theft
slug: cloud-imds-cred-theft
tier: basic
category: cloud
aliases: [imds, metadata-creds, 169.254.169.254]
summary: >
  Read temporary role credentials from the cloud instance metadata service once
  you can make the server issue requests to it.
requires:
  - server-side-request
provides:
  - cloud-credentials
achieves:
  - cloud-account-compromise
detection: >
  Metadata service reads from workloads that do not normally call it; use of
  instance-role credentials from an unexpected source IP (GuardDuty
  InstanceCredentialExfiltration).
remediation: >
  Enforce IMDSv2 (session tokens) with hop limit 1; scope instance roles to least
  privilege; alert on credential use outside the instance.
mitre: [T1552.005]
references:
  - title: AWS - Use IMDSv2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
  - title: "Capital One breach — SSRF → IMDS → S3 (Krebs on Security)"
    url: https://krebsonsecurity.com/2019/08/what-we-can-learn-from-the-capital-one-hack/
chains:
  - to: cloud-data-access
    via: [cloud-credentials]
    outcome: >
      Replay the instance-role credentials against object storage — the Capital One
      breach read 100M+ records from 700+ S3 buckets this way.
    tier: basic
    difficulty: easy
    documented: true
    references:
      - https://krebsonsecurity.com/2019/08/what-we-can-learn-from-the-capital-one-hack/
  - to: cloud-iam-privesc
    via: [cloud-credentials]
    outcome: >
      If the instance role is over-permissioned, enumerate IAM and escalate to an
      administrative role.
    tier: advanced
    difficulty: medium
    documented: false
