id: shadow-credentials
name: Shadow Credentials
slug: shadow-credentials
tier: advanced
category: active-directory
aliases: [shadow-creds, msds-keycredentiallink, whisker, addkeycredentiallink]
summary: >
  With write control over a user or computer object, add a key to its
  msDS-KeyCredentialLink attribute, then authenticate as that principal via PKINIT and
  recover its NT hash. A quiet alternative to resetting the password.
requires:
  - ad-object-control
  - machine-account-control
provides:
  - nt-hash
detection: >
  Changes to msDS-KeyCredentialLink (event 5136); PKINIT logons for accounts that never
  used certificates; Whisker/Certipy tooling.
remediation: >
  Restrict who can write msDS-KeyCredentialLink; monitor that attribute; require strong
  mapping for certificate logons; tier administration.
mitre: [T1556]
references:
  - title: "MITRE ATT&CK — Modify Authentication Process (T1556)"
    url: https://attack.mitre.org/techniques/T1556/
chains: []
