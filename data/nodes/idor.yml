id: idor
name: Insecure Direct Object Reference
slug: idor
tier: basic
category: web
aliases: [idor, bola]
summary: >
  The application exposes a reference to an object (id, filename, account) and
  fails to verify the caller is authorized for it, allowing access to other users'
  or admins' objects.
requires: []
provides:
  - auth-bypass
  - info-disclosure
achieves:
  - privilege-escalation
  - auth-bypass
detection: >
  Sequential/enumerable ids accessed out of a user's normal set; one account
  reading many distinct object ids; 200s on objects another tenant owns.
remediation: >
  Enforce per-object authorization on every request, use unguessable ids as a
  defence-in-depth only, centralise access-control checks.
mitre: [T1190]
references:
  - title: OWASP - Broken Object Level Authorization
    url: https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
chains:
  - to: session-hijack
    via: [auth-bypass]
    outcome: >
      Pivot an authorization flaw on an admin or victim object into account
      takeover (e.g. reset another user's credentials).
    tier: basic
    difficulty: medium
    documented: false
