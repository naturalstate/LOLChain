id: file-upload-unrestricted
name: Unrestricted File Upload
slug: file-upload-unrestricted
tier: basic
category: web
aliases: [file-upload, unrestricted-upload]
summary: >
  The application stores an uploaded file without validating type or location,
  letting an attacker place a server-executable file. Degrades to stored XSS when
  the file is served but not executed.
requires:
  - attacker-controlled-upload
provides:
  - arbitrary-file-write
achieves: []
detection: >
  Uploads with executable extensions or polyglot content-types; files written into
  web-served directories; mismatched magic bytes vs declared type.
remediation: >
  Allowlist extensions and content-types, store outside the web root with random
  names, disable execution in upload dirs, re-encode images.
mitre: [T1190]
references:
  - title: PortSwigger - File upload vulnerabilities
    url: https://portswigger.net/web-security/file-upload
chains:
  - to: webshell-rce
    via: [arbitrary-file-write]
    outcome: Upload a webshell into an executable path, then request it for RCE.
    tier: basic
    difficulty: easy
    documented: true
    references:
      - https://portswigger.net/web-security/file-upload
